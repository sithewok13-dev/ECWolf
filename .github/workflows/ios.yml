# Builds an unsigned Wolf3D-ios.ipa (ECWolf for iPhone and iPad: Wolfenstein
# 3D, Spear of Destiny and its mission packs), with touch controls.
# Sideload it, then copy your own game files into Files > On My iPhone >
# Wolf3D. No game data is in the app (only ECWolf's own ecwolf.pk3).
#
# Every run keeps the .ipa as a workflow artifact. Builds of the ios branch
# also update the public "ios-latest" prerelease (Wolf3D-ios.ipa, no game
# data); runs on other ios-* branches (work in progress) publish nothing.
# (Modelled on the owner's UZDoom and Raze ports, .github/workflows/ios.yml.)
#
# Numbered releases (modelled on the Serious Sam port's workflow): a manual
# run of branch ios with "release" set to a tag such as ios-v0.1
# (gh workflow run ios.yml --ref ios -f release=ios-v0.1) publishes a
# release for that tag, created at the commit being built, with
# docs/ios/RELEASE_NOTES.md from that commit as its text and only the .ipa
# files in RELEASE_IPAS attached, marked as the latest release. A version
# with a '-' in it (ios-v0.2-beta1) is a prerelease instead and isn't
# marked latest. ios-latest is left alone. The run stops before building if
# it isn't on branch ios, the tag isn't ios-v<version>, is already on
# another commit, or the notes have no "### What's in <tag>" line. Running
# it again for the same tag on the same commit updates that release.
# After publishing, it adds the release to the AltStore / SideStore source
# (packaging/ios/altstore-source.json) and commits that to branch ios. If
# that part fails, the release is still out: add it by hand.
name: iOS

on:
  push:
    branches: [ "ios", "ios-*" ]
    # A push that only changes the AltStore / SideStore source (a release
    # run commits it; the app doesn't include it) builds nothing.
    paths-ignore:
      - 'packaging/ios/altstore-source.json'
  workflow_dispatch:
    inputs:
      release:
        description: >-
          Publish this build as a release with this tag (for example ios-v0.1),
          created at the commit being built. Leave empty for an ordinary build.
        required: false
        default: ''

concurrency:
  # As before, a new push cancels the branch's older run. Release runs for
  # one tag go one at a time and are never cancelled halfway.
  group: ${{ inputs.release != '' && format('ios-release-{0}', inputs.release) || format('ios-{0}', github.ref) }}
  cancel-in-progress: ${{ inputs.release == '' }}

env:
  IOS_MIN: "15.0"
  SDL_TAG: release-2.32.8
  MIXER_TAG: release-2.8.1
  NET_TAG: release-2.2.0
  # The tag a manual run was asked to release; empty for pushes and ordinary runs.
  RELEASE_TAG: ${{ inputs.release }}
  # The .ipa files a release gets, space-separated.
  RELEASE_IPAS: Wolf3D-ios.ipa
  # Release title; the tag's version is added after it (ios-v0.1 -> "... v0.1").
  RELEASE_TITLE: "Wolf3D for iOS"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    outputs:
      build_date: ${{ steps.stamp.outputs.date }}
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
        fetch-depth: 0

    # Before the build: a release needs branch ios, a usable tag and notes
    # written for it.
    - name: Check release tag and notes
      if: env.RELEASE_TAG != ''
      run: |
        set -e
        if [ "$GITHUB_REF" != "refs/heads/ios" ]; then
          echo "::error::Releases are made from branch ios only (this run is on $GITHUB_REF)."
          exit 1
        fi
        case "$RELEASE_TAG" in
          ios-v*) ;;
          *) echo "::error::Release tag \"$RELEASE_TAG\" should look like ios-v0.1 (ios-v<version>)."; exit 1 ;;
        esac
        if ! git check-ref-format "refs/tags/$RELEASE_TAG"; then
          echo "::error::\"$RELEASE_TAG\" can't be a git tag name."
          exit 1
        fi
        # A tag already there must be on this commit, or the release's .ipa and
        # its tag's source would differ (publishing doesn't move a tag).
        REFS=$(git ls-remote origin "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}")
        TAGGED=$(echo "$REFS" | tail -n 1 | cut -f 1)
        if [ -n "$TAGGED" ] && [ "$TAGGED" != "$GITHUB_SHA" ]; then
          echo "::error::Tag $RELEASE_TAG is already on commit $TAGGED, not on $GITHUB_SHA (the commit this run builds). Pick a new tag."
          exit 1
        fi
        if ! grep -qxF "### What's in ${RELEASE_TAG}" docs/ios/RELEASE_NOTES.md; then
          echo "::error file=docs/ios/RELEASE_NOTES.md::No \"### What's in ${RELEASE_TAG}\" heading line. Update the release notes for ${RELEASE_TAG}, commit and push them, then run this again."
          exit 1
        fi

    - name: Select newest Xcode
      run: |
        set -e
        XCODE=$(ls -d /Applications/Xcode_*.app | grep -iv beta | sort -V | tail -1)
        echo "Using $XCODE"
        sudo xcode-select -s "$XCODE/Contents/Developer"
        xcodebuild -version
        xcrun --sdk iphoneos --show-sdk-version

    - name: Host tools
      run: brew install ninja

    - name: Restore iOS dependencies
      id: deps
      uses: actions/cache/restore@v4
      with:
        path: deps-ios
        key: ios-deps-${{ env.SDL_TAG }}-${{ env.MIXER_TAG }}-${{ env.NET_TAG }}-${{ env.IOS_MIN }}-${{ hashFiles('ios/build_deps.sh') }}

    - name: Build SDL2, SDL2_mixer and SDL2_net for iOS
      if: steps.deps.outputs.cache-hit != 'true'
      run: ios/build_deps.sh "$PWD/deps-ios"

    - name: Save iOS dependencies
      if: steps.deps.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: deps-ios
        key: ${{ steps.deps.outputs.cache-primary-key }}

    # zipdir (which makes ecwolf.pk3 from wadsrc/) runs on the Mac
    - name: Build host tools
      run: |
        set -e
        cmake -S . -B host -G Ninja -DCMAKE_BUILD_TYPE=Release -DTOOLS_ONLY=ON \
          -DCMAKE_POLICY_VERSION_MINIMUM=3.5 > host-configure.log 2>&1 || { tail -60 host-configure.log; exit 1; }
        cmake --build host --target zipdir
        test -f host/ImportExecutables.cmake

    - name: Configure
      run: |
        set -e
        DEPS=$PWD/deps-ios
        # Homebrew's pkg-config would hand the iOS build Mac libraries: hide them
        export PKG_CONFIG_LIBDIR=/nonexistent PKG_CONFIG_PATH=
        cmake -S . -B build -G Ninja \
          -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_ARCHITECTURES=arm64 \
          -DCMAKE_OSX_DEPLOYMENT_TARGET=$IOS_MIN -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
          -DIMPORT_EXECUTABLES=$PWD/host/ImportExecutables.cmake \
          -DINTERNAL_JPEG=ON \
          -DCMAKE_DISABLE_FIND_PACKAGE_SDL2=ON -DCMAKE_DISABLE_FIND_PACKAGE_SDL2_mixer=ON -DCMAKE_DISABLE_FIND_PACKAGE_SDL2_net=ON \
          "-DSDL2_LIBRARIES=$DEPS/lib/libSDL2main.a;$DEPS/lib/libSDL2.a" -DSDL2_INCLUDE_DIRS=$DEPS/include/SDL2 \
          -DSDL2_mixer_LIBRARIES=$DEPS/lib/libSDL2_mixer.a -DSDL2_mixer_INCLUDE_DIRS=$DEPS/include/SDL2 \
          -DSDL2_net_LIBRARIES=$DEPS/lib/libSDL2_net.a -DSDL2_net_INCLUDE_DIRS=$DEPS/include/SDL2 \
          "-DCMAKE_IGNORE_PREFIX_PATH=/opt/homebrew;/usr/local" \
          -DECWOLF_IOS_VERSION=0.1.${{ github.run_number }}

    - name: Build
      run: |
        cmake --build build -- -k 0 > build.log 2>&1 || {
          grep -E "error:|FAILED:|undefined symbol|ld: |CMake Error" build.log | head -120
          echo "----- end of the build log -----"
          tail -80 build.log | cut -c1-400
          echo "::error::Build failed"
          exit 1
        }
        grep -E "(ios/).*warning:" build.log | sort -u | head -60 || true
        tail -3 build.log

    # The build stamp: the run number and the date (UTC), shown under the
    # open MENU tray as "build 80 · Nov 9" and on the release's first line
    - name: Build stamp
      id: stamp
      run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

    - name: Package .ipa
      run: |
        set -e
        APP=$(find build -maxdepth 3 -name "Wolf3D.app" -type d | head -1)
        echo "App bundle: $APP"
        test -n "$APP"
        test -f "$APP/Wolf3D"
        test -f "$APP/ecwolf.pk3"
        # The icon: ECWolf's own, in the sizes iOS asks for
        SRC=src/macosx/icon.iconset/icon_512x512.png
        sips -z 120 120 "$SRC" --out "$APP/AppIcon60x60@2x.png" > /dev/null
        sips -z 180 180 "$SRC" --out "$APP/AppIcon60x60@3x.png" > /dev/null
        sips -z 152 152 "$SRC" --out "$APP/AppIcon76x76@2x~ipad.png" > /dev/null
        sips -z 167 167 "$SRC" --out "$APP/AppIcon83.5x83.5@2x~ipad.png" > /dev/null
        PL="$APP/Info.plist"
        /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" "$PL"
        /usr/libexec/PlistBuddy -c "Delete :SWBuildNumber" "$PL" 2>/dev/null || true
        /usr/libexec/PlistBuddy -c "Delete :SWBuildDate" "$PL" 2>/dev/null || true
        /usr/libexec/PlistBuddy -c "Add :SWBuildNumber string ${{ github.run_number }}" "$PL"
        /usr/libexec/PlistBuddy -c "Add :SWBuildDate string ${{ steps.stamp.outputs.date }}" "$PL"
        plutil -lint "$PL"
        plutil -p "$PL" | grep -E "CFBundle(Identifier|Name|DisplayName|(Short)?Version)|SWBuild"
        ls -la "$APP"
        codesign --force --sign - --timestamp=none "$APP"
        mkdir -p ipa/Payload
        cp -R "$APP" ipa/Payload/
        # No game data in the app: none of the games' files may be in it
        BAD=$(find ipa/Payload -type f \( -iname '*.wl1' -o -iname '*.wl3' -o -iname '*.wl6' -o -iname '*.sdm' -o -iname '*.sod' \
          -o -iname '*.sd1' -o -iname '*.sd2' -o -iname '*.sd3' -o -iname '*.n3d' \) )
        if [ -n "$BAD" ]; then echo "$BAD"; echo "::error::Game data is in the app"; exit 1; fi
        (cd ipa && zip -qry ../Wolf3D-ios.ipa Payload)
        ls -la Wolf3D-ios.ipa

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: Wolf3D-ios
        path: Wolf3D-ios.ipa

  release:
    name: ${{ inputs.release != '' && format('Publish release {0}', inputs.release) || 'Publish to "iOS latest" prerelease' }}
    needs: build
    if: github.ref == 'refs/heads/ios'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    # Release runs only: the notes and the source's script from the run's
    # commit. Kept first, as checkout empties the folder it checks out into.
    - name: Get release notes
      if: env.RELEASE_TAG != ''
      uses: actions/checkout@v4
      with:
        sparse-checkout: |
          docs/ios/RELEASE_NOTES.md
          packaging/ios/update_altstore_source.py
        sparse-checkout-cone-mode: false
        persist-credentials: false

    - uses: actions/download-artifact@v4
      with:
        name: Wolf3D-ios
        path: out

    # Pushes and ordinary manual runs; a release run leaves ios-latest alone.
    - name: Publish to "ios-latest" prerelease
      if: env.RELEASE_TAG == ''
      uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
      with:
        tag_name: ios-latest
        target_commitish: ${{ github.sha }}
        name: iOS latest build
        prerelease: true
        make_latest: false
        body: |
          Build ${{ github.run_number }} · ${{ needs.build.outputs.build_date }}
          Development build of Wolf3D (ECWolf) for iPhone and iPad, rebuilt after every push to the `ios` branch (run ${{ github.run_number }}, commit ${{ github.sha }}). It may not have been tried yet.
          Wolf3D-ios.ipa is unsigned: sideload it (for example with Feather), then copy your own game files (Wolfenstein 3D, Spear of Destiny and its mission packs, from GOG, Steam or CD) into Files > On My iPhone > Wolf3D. No game data is included.
        files: out/Wolf3D-ios.ipa

    # Release runs: only the .ipa files in RELEASE_IPAS, the title and whether
    # it's a prerelease (a '-' in the version, after the "ios-").
    - name: Prepare release
      id: rel
      if: env.RELEASE_TAG != ''
      run: |
        set -e
        if ! grep -qxF "### What's in ${RELEASE_TAG}" docs/ios/RELEASE_NOTES.md; then
          echo "::error file=docs/ios/RELEASE_NOTES.md::No \"### What's in ${RELEASE_TAG}\" heading line."
          exit 1
        fi
        mkdir release
        for ipa in $RELEASE_IPAS; do
          if [ ! -f "out/$ipa" ]; then
            echo "::error::$ipa (in RELEASE_IPAS) wasn't built."
            exit 1
          fi
          cp "out/$ipa" release/
        done
        ls -la release
        VERSION=${RELEASE_TAG#ios-}
        case "$VERSION" in
          *-*) PRERELEASE=true; LATEST=false ;;
          *) PRERELEASE=false; LATEST=true ;;
        esac
        echo "Release \"$RELEASE_TITLE $VERSION\", prerelease $PRERELEASE, latest $LATEST"
        { echo "Build ${{ github.run_number }} · ${{ needs.build.outputs.build_date }}"; echo; cat docs/ios/RELEASE_NOTES.md; } > release-notes.md
        {
          echo "name=$RELEASE_TITLE $VERSION"
          echo "prerelease=$PRERELEASE"
          echo "latest=$LATEST"
        } >> "$GITHUB_OUTPUT"

    - name: Publish release for the tag
      if: env.RELEASE_TAG != ''
      uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
      with:
        # Creates the tag at the commit this run built (left out, GitHub would
        # put a new tag on the default branch, master)
        tag_name: ${{ env.RELEASE_TAG }}
        target_commitish: ${{ github.sha }}
        name: ${{ steps.rel.outputs.name }}
        body_path: release-notes.md
        prerelease: ${{ steps.rel.outputs.prerelease }}
        make_latest: ${{ steps.rel.outputs.latest }}
        files: release/*.ipa
        fail_on_unmatched_files: true

    # The AltStore / SideStore source (packaging/ios/altstore-source.json)
    # gets the release just published: a new entry with the size, SHA-256,
    # date, download link and a summary of the notes
    # (packaging/ios/update_altstore_source.py), committed to branch ios
    # (the source's address points there; the default branch is upstream's
    # master). It's a commit by GITHUB_TOKEN marked [skip ci], and the file
    # is in paths-ignore, so it starts no build. continue-on-error: if
    # anything here fails, the release (already out) still counts.
    - name: Add the release to the AltStore / SideStore source
      if: env.RELEASE_TAG != ''
      continue-on-error: true
      env:
        GH_TOKEN: ${{ github.token }}
        SOURCE_BRANCH: ios
      run: |
        set -euo pipefail
        trap 'echo "::warning::The AltStore / SideStore source was not updated for ${RELEASE_TAG}. The release itself is published; add it to packaging/ios/altstore-source.json by hand."' ERR
        SRC="$RUNNER_TEMP/altstore-source"
        rm -rf "$SRC"
        git clone --quiet --depth 1 --branch "$SOURCE_BRANCH" \
          "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$SRC"
        git -C "$SRC" config user.name "github-actions[bot]"
        git -C "$SRC" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        IPAS=()
        for ipa in $RELEASE_IPAS; do IPAS+=(--ipa "release/$ipa"); done
        for attempt in 1 2 3; do
          # The script and the notes come from the commit just built; the
          # source file from the newest ios branch
          python3 -I packaging/ios/update_altstore_source.py \
            --source "$SRC/packaging/ios/altstore-source.json" \
            --tag "$RELEASE_TAG" --notes docs/ios/RELEASE_NOTES.md "${IPAS[@]}"
          if git -C "$SRC" diff --quiet; then
            echo "The source already has ${RELEASE_TAG}"
            break
          fi
          git -C "$SRC" commit --quiet -am "iOS: add ${RELEASE_TAG} to the AltStore / SideStore source [skip ci]"
          if git -C "$SRC" push --quiet origin "HEAD:${SOURCE_BRANCH}"; then
            echo "Added ${RELEASE_TAG} to the source on ${SOURCE_BRANCH}"
            break
          fi
          if [ "$attempt" = 3 ]; then
            false # gives up (the warning above)
          fi
          # Someone pushed in between: start again from the new branch head
          git -C "$SRC" fetch --quiet --depth 1 origin "$SOURCE_BRANCH"
          git -C "$SRC" reset --quiet --hard FETCH_HEAD
        done
        rm -rf "$SRC"
